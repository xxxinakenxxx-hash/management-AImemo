<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理職AIメモ（外部画面）</title><link rel="stylesheet" href="styles.css"></head><body><main><header class="header"><h1>管理職AIメモ（外部画面）</h1><button id="settings" class="secondary">設定</button></header><section id="settings-panel" class="card settings-panel" hidden><h2>設定／データ管理</h2><p id="summary"></p><button id="backup-export">暗号化バックアップを書き出す</button><button id="backup-import">バックアップから復元する</button><input id="backup-file" type="file" accept=".maimemo,application/json" hidden><button id="delete-all" class="danger">端末内データを全件削除</button><p>プライバシー: 個人TODO、入力原文、人物、期限、委任内容、報告内容は本人端末内だけに保存します。</p><p>AI利用: AIを使わない登録・一覧・編集・バックアップは外部通信を行いません。</p><p>音声入力: 音声は保存・アップロードせず、認識した確定文字列だけを入力欄へ追加します。</p><p>版情報: IS-12 ／ 問い合わせ先: アプリ管理者</p></section><section class="card"><textarea id="input" placeholder="メモを入力してください"></textarea><div class="input-actions"><button id="speech-start" class="secondary">音声入力を開始</button><button id="speech-stop" class="secondary" disabled>音声入力を停止</button><button id="ai">AIで整理</button><button id="save">そのまま登録</button></div><p id="speech-state" class="speech-state" role="status"></p><p id="status" role="status"></p></section><nav id="tabs" class="tabs"></nav><section class="card"><h2>TODO一覧</h2><div id="list"></div></section></main><dialog id="todo-actions"><form method="dialog"><h2>TODOの操作</h2><div class="dialog-actions"><button id="email-action" value="default">メールを作成</button><button id="calendar-action" value="default">カレンダーに登録</button><button id="copy-action" value="default">本文をコピー</button><button value="cancel" class="secondary">閉じる</button></div></form></dialog><dialog id="calendar-date-dialog"><form id="calendar-date-form"><h2>予定日を選択</h2><label for="calendar-date-input">直接入力（YYYY-MM-DD）</label><div class="calendar-date-row"><input id="calendar-date-input" type="text" inputmode="numeric" placeholder="YYYY-MM-DD" autocomplete="off"><input id="calendar-date-picker" type="date" aria-label="カレンダーから選択"><button id="calendar-date-picker-button" type="button" class="secondary">カレンダーから選択</button></div><div class="dialog-actions"><button id="calendar-date-cancel" type="button" class="secondary">キャンセル</button><button id="calendar-date-confirm" type="submit">カレンダーを開く</button></div></form></dialog><script src="config.js?v=20260805-4"></script><script src="todo-service.js?v=20260805-4"></script><script src="todo-store.js?v=20260805-4"></script><script src="app.js?v=20260805-5"></script></body></html>
